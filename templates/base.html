<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Splitz - simple travel expense tracking and splitting">
    <title>{% block title %} Splitz {% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="bg-light d-flex flex-column h-100">

<nav class="navbar navbar-dark bg-dark shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/" aria-label="Splitz Home">
            <i class="bi bi-airplane" aria-hidden="true"></i> Splitz
        </a>
        <div class="d-flex gap-1 gap-sm-2">

            <a class="btn btn-outline-light btn-sm" href="/addperson" aria-label="Add Person">
                <i class="bi bi-person"></i> 
                <span class="d-none d-sm-inline">Add Person</span>
            </a>
            <a class="btn btn-success btn-sm" href="/add" aria-label="Add Expense">
                <i class="bi bi-plus-circle"></i> 
                <span class="d-none d-sm-inline">Add Expense</span>
            </a>
            <a class="btn btn-warning btn-sm" href="/summary" aria-label="Summary">
                <i class="bi bi-graph-up"></i> 
                <span class="d-none d-sm-inline">Summary</span>
            </a>
            <a class="btn btn-outline-light btn-sm" href="/expenses" aria-label="Expenses">
                <i class="bi bi-receipt"></i> 
                <span class="d-none d-sm-inline">Expenses</span>
            </a>
        </div>
    </div>
</nav>

<main class="container py-4 flex-grow-1">
    {% block content %}{% endblock %}
</main>

<footer class="bg-dark text-light mt-auto py-4">
    <div class="container d-flex flex-column flex-md-row justify-content-md-start align-items-center gap-4">
        
        <div class="text-center text-md-start">
            <i class="bi bi-airplane" aria-hidden="true"></i>
            <strong>Splitz</strong> &copy; 2026
        </div>

        <nav class="d-flex gap-3 justify-content-center">
            <a href="/" class="text-light text-decoration-none opacity-75 link-hover">Home</a>
            <a href="/addperson" class="text-light text-decoration-none opacity-75 link-hover">Add Person</a>
            <a href="/expenses" class="text-light text-decoration-none opacity-75 link-hover">Expenses</a>
            <a href="/summary" class="text-light text-decoration-none opacity-75 link-hover">Summary</a>
        </nav>
        
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
